<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <style>
    :root { --ground: #0a0a0a; --ink: #ffffff; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 1920px; height: 1080px; background: var(--ground); overflow: hidden; font-family: system-ui, sans-serif; }
    .clip { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--ink); font-size: 120px; letter-spacing: -0.04em; font-weight: 800; opacity: 0; }
  </style>
</head>
<body>
  <!-- O atributo data-composition-id resolve o root_missing_composition_id -->
  <!-- data-width e data-height resolvem o root_missing_dimensions -->
  <div id="timeline" data-composition-id="main" data-width="1920" data-height="1080">
    <h1 id="scene-1" class="clip" data-start="0" data-duration="2" data-track-index="0">O PRIMEIRO CORTE</h1>
    <h1 id="scene-2" class="clip" data-start="2" data-duration="2" data-track-index="0" style="color: #4ade80;">A CHAVE VIROU</h1>
    <h1 id="scene-3" class="clip" data-start="4" data-duration="2" data-track-index="0" style="color: #60a5fa;">A PORTA ABRIU</h1>
  </div>

  <script>
    // O registro resolve o missing_timeline_registry. O HyperFrames usa isso para achar a animação.
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline();
    tl.to("#scene-1", { opacity: 1, y: -20, duration: 1, delay: 0.2 })
      .to("#scene-2", { opacity: 1, y: -20, duration: 1 }, 2.2)
      .to("#scene-3", { opacity: 1, y: -20, duration: 1 }, 4.2);
      
    window.__timelines["main"] = tl;
  </script>
</body>
</html>
